name: publish-package
on:
  push:
    branches:
      - master
  # Lets a release be retried without an empty commit -- useful when the
  # versions are already bumped in master and only the publish step failed.
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Type Check
        run: yarn run typecheck

      - name: Lint
        run: yarn run lint

      - name: Test
        run: yarn run test

      - name: Health Check
        run: |
          yarn run clean
          yarn workspaces foreach --verbose run build:package

      - name: Publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          yarn changeset status
          yarn changeset version
          . "./scripts/commit-ci-changes.sh"
          # Published with yarn, not `changeset publish`: the latter shells out
          # to npm, which sends the manifest it read before `prepack` ran and
          # does not understand the `workspace:` protocol at all. That is how
          # admin-ui 2.0.2 reached the registry declaring
          # `"@tager/admin-services": "workspace:*"`, which no consumer can
          # resolve. Yarn expands workspace ranges and applies publishConfig
          # itself, so no package.json rewriting is needed.
          yarn workspaces foreach --no-private --topological npm publish --tolerate-republish --access public
          yarn changeset tag
          git push --follow-tags
        env:
          # Yarn Berry reads its own config, not the .npmrc setup-node writes.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
